name: Automated tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  # v4 — the package, at the repo root
  ci:
    runs-on: ubuntu-latest
    # No `timeout-minutes`: the 15-minute cap was killing runs (2026-08-05).
    # Falls back to GitHub's 360-minute job default, which is a backstop rather
    # than a budget.  Re-impose a cap once the suite's real wall-clock is known.
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-node@v6
      with:
        node-version-file: .nvmrc
    - name: Install dependencies
      run: npm ci
    # The v3-vs-v4 parity diffs in the `visual` project render both renderers
    # in one page, so they need v3's UMD bundle from the v3/ subproject.  The
    # specs fail with this instruction rather than skipping (round 42), so a
    # missing baseline cannot read as a pass.
    - name: Build the v3 comparison baseline
      run: npm install && npm run build:umd
      working-directory: v3
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    # `build/` is gitignored, so a fresh checkout has no bundle — and
    # `test/modules/status-site.mjs` plans the status site's mirror of the
    # debug harness, which loads `../build/cytoscape.umd.js`.  Playwright's
    # webServer does build one, but that runs later in the `run-s` chain than
    # `test:modules`, so without this step three specs fail on the runner and
    # pass on any machine that has ever built.
    - name: Build the bundles
      run: npm run build
    - name: Run tests
      run: npm test
    - name: Verify type definitions
      run: npm run test:types:all

  # v3 — kept self-contained in v3/ for comparison benchmarks and parity work
  # (round 42).  It builds and tests as its own project.
  ci-v3:
    runs-on: ubuntu-latest
    # see the note on `ci` above
    defaults:
      run:
        working-directory: v3
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-node@v6
      with:
        node-version-file: .nvmrc
    - name: Install dependencies
      run: npm install
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Run tests
      run: npm test
    - name: Verify type definitions
      run: npm run test:types:all
