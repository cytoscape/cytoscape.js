name: Automated tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  # v4's Node tier — everything that does not need a browser.  Split from the
  # browser tier (round 52) because the two share no work and the Playwright
  # projects dominate the wall clock: run serially they add up, run as
  # separate jobs the suite finishes in the time of its slowest part.
  # `npm run test:node` is the same chain a developer gets from `npm test`
  # minus the Playwright half, so there is one definition of it, in
  # package.json rather than here.
  #
  # Round 151: the Node tier runs on Windows and macOS as well, so a path,
  # shell or line-ending assumption breaks here rather than for a user.
  ci-node:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    name: ci-node (${{ matrix.os }})
    # No `timeout-minutes`: the 15-minute cap was killing runs (2026-08-05).
    # Falls back to GitHub's 360-minute job default, which is a backstop rather
    # than a budget.  Re-impose a cap once the suite's real wall-clock is known.
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-node@v6
      with:
        node-version-file: .nvmrc
    - name: Install dependencies
      run: npm ci
    # `test:modules` builds for itself now (the status-site specs read
    # build/cytoscape.umd.js and encode through build/cytoscape.cjs.js), so
    # this step is not what makes the suite pass.  It is kept because it is
    # sub-second and it makes a broken build read as a broken build, here,
    # rather than as a test failure two minutes later.
    - name: Build the bundles
      run: npm run build
    - name: Run the Node suite
      run: npm run test:node
    - name: Verify type definitions
      run: npm run test:types:all

  # v4's Bun tier: the complete Node verification suites and throw coverage
  # run under Bun at a pinned floor and latest stable.  Each job is shaped like
  # `ci-node` — checkout, official
  # setup action, root `npm ci`, `npm run build` — and no v3 install (the
  # Node-tier invariant extends here).  The matrix runs **latest stable plus
  # a pinned floor**.  Bun 1.4.0 is the measured supported floor: round 99
  # passed the complete suites and coverage gate at that version.  The local
  # latest-stable measurement was Bun 1.4.3 on 2026-10-12; CI keeps that leg
  # floating as `latest`.  `engines` cannot express the Bun floor, so the
  # measured value lives here and in the support sentence in src/README.md. A
  # runtime bump that breaks the job is handled like a
  # browser bump breaking a golden: read the failure, then move the pin —
  # never widen the assertion.
  #
  # Round 151 adds Windows and macOS legs at `latest` only; the floor stays a
  # Linux leg, to bound the matrix.
  ci-bun:
    runs-on: ${{ matrix.os }}
    # see the note on `ci-node` above
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        bun-version: ['1.4.0', 'latest']
        include:
        - os: windows-latest
          bun-version: latest
        - os: macos-latest
          bun-version: latest
    name: ci-bun (${{ matrix.bun-version }}, ${{ matrix.os }})
    steps:
    - uses: actions/checkout@v6
    # Node runs install, typecheck/lint/build tooling; Bun runs the test suites.
    - uses: actions/setup-node@v6
      with:
        node-version-file: .nvmrc
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version: ${{ matrix.bun-version }}
    - name: Install dependencies
      run: npm ci
    - name: Build the bundles
      run: npm run build
    - name: Run the Node test suites under Bun
      run: npm run test:bun

  # Round 131: the headless build on Cloudflare's own runtime, `workerd`
  # (a devDependency, so `npm ci` fetches its platform binary).  Opt-in
  # the way `ci-bun` is: its own job, gating like it.  The
  # Node tier's isolate smoke (`test/modules/isolate-smoke.test.mjs`) is the
  # per-run gate that needs nothing installed; if workerd proves flaky on
  # runners, this drops to a release-time run and the record says so.
  # Linux-only (round 151): it tests the bundle on workerd, not the host OS.
  ci-workerd:
    runs-on: ubuntu-latest
    name: ci-workerd
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-node@v6
      with:
        node-version-file: .nvmrc
    - name: Install dependencies
      run: npm ci
    - name: Build the bundles
      run: npm run build
    - name: Run the headless build on workerd
      run: node test/runtimes/workerd.mjs

  # v4's browser tier, one job per Playwright project.  Each installs only
  # the browser it drives; only `visual` and `parity` need v3's bundle.
  #
  # Round 151: `renderer` also runs on Windows (Chromium) and
  # `renderer-webkit` on macOS (WebKit on Metal).  `visual` and `parity`
  # stay Linux-only: their goldens are SwiftShader pixels rasterised on
  # Linux, and another OS would need its own baselines.
  ci-browser:
    runs-on: ${{ matrix.os }}
    # see the note on `ci-node` above
    strategy:
      fail-fast: false
      matrix:
        include:
        - project: renderer
          browser: chromium
          os: ubuntu-latest
        - project: renderer-webkit
          browser: webkit
          os: ubuntu-latest
        - project: visual
          browser: chromium
          os: ubuntu-latest
        - project: parity
          browser: chromium
          os: ubuntu-latest
        - project: renderer
          browser: chromium
          os: windows-latest
        - project: renderer-webkit
          browser: webkit
          os: macos-latest
    name: ci-browser (${{ matrix.project }}, ${{ matrix.os }})
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-node@v6
      with:
        node-version-file: .nvmrc
    - name: Install dependencies
      run: npm ci
    # The v3-vs-v4 parity diffs and gesture traces in the `parity` project
    # render both libraries in one page, so they need v3's UMD bundle from
    # the v3/ subproject (`visual`'s routing and bundle specs do too).  The
    # specs fail with this instruction rather than skipping (round 42), so a
    # missing baseline cannot read as a pass.
    - name: Build the v3 comparison baseline
      if: matrix.project == 'visual' || matrix.project == 'parity'
      run: npm ci && npm run build:umd
      working-directory: v3
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps ${{ matrix.browser }}
    # This job drives `npx playwright test --project=...` rather than
    # `npm run test:playwright`, so it does not get that script's own build
    # steps — and Playwright's webServer only builds the UMD after the server
    # command runs.  Build here, where a failure reads as a build failure.
    - name: Build the bundles
      run: npm run build
    - name: Run the ${{ matrix.project }} project
      run: npx playwright test --project=${{ matrix.project }}
    - name: Upload latest golden captures
      if: always() && matrix.project == 'visual'
      uses: actions/upload-artifact@v7
      with:
        name: golden-current
        path: playwright-tests/golden-current/
        retention-days: 7
    - name: Upload failure artifacts
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: playwright-${{ matrix.project }}-${{ matrix.os }}
        path: test-results/
        retention-days: 7

  # v3 — kept self-contained in v3/ for comparison benchmarks and parity work
  # (round 42).  It builds and tests as its own project.  Frozen, so it
  # stays Linux-only (round 151).
  ci-v3:
    runs-on: ubuntu-latest
    # see the note on `ci-node` above
    defaults:
      run:
        working-directory: v3
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-node@v6
      with:
        node-version-file: .nvmrc
    # `npm ci` since v3's lockfile is tracked (2026-08-06).  It used to float
    # on caret ranges, so the job resolved a different dependency set on every
    # push and nothing here was reproducible.
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Run tests
      run: npm test
    - name: Verify type definitions
      run: npm run test:types:all
