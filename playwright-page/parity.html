<!DOCTYPE html>
<html>

  <head>
    <meta http-equiv="content-type" content="text/html;charset=UTF-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1, maximum-scale=1">

    <style>
      /* fixed test font (OFL, via the @fontsource/open-sans devDependency),
         as on index.html: the round-94 label parity scene renders text on
         both sides, and the diff is only meaningful when both rasterize
         the same pinned face — specs pre-load it with document.fonts.load
         before creating either instance */
      @font-face {
        font-family: 'Open Sans';
        font-style: normal;
        font-weight: 400;
        src: url('../node_modules/@fontsource/open-sans/files/open-sans-latin-400-normal.woff2') format('woff2');
      }

      body {
        font-family: helvetica, arial, sans-serif;
        margin: 0;
      }

      .cy {
        width: 400px;
        height: 300px;
        position: absolute;
        top: 0;
        background: white;
      }

      #v3 {
        left: 0;
      }

      #v4 {
        left: 410px;
      }
    </style>

    <!-- Both UMD bundles export the global `cytoscape`, so v3's is captured
         under its own name before v4's script overwrites it (round 42: v4
         became the package, and v3's bundle now builds from v3/). -->
    <script src="../v3/build/cytoscape.umd.js"></script>
    <script>window.cytoscapeV3 = window.cytoscape;</script>
    <script src="../build/cytoscape.umd.js"></script>

    <title>cytoscape.js v3-vs-v4 parity page</title>
  </head>

  <body>
      <div id="v3" class="cy"></div>
      <div id="v4" class="cy"></div>

      <script>
        // The parity specs render the same fixture with the classic (v3)
        // canvas renderer and the GPU prototype side by side, then diff
        // the two exports.
        window.makeV3 = function( options ){
          window.cy3 = cytoscapeV3( Object.assign( {
            container: document.getElementById( 'v3' )
          }, options ) );

          return window.cy3;
        };

        window.makeV4 = function( options ){
          window.cy4 = cytoscape( Object.assign( {
            container: document.getElementById( 'v4' )
          }, options ) );

          return window.cy4;
        };
      </script>

      <!-- round 55: the numeric routing probe.  It reads public accessors
           off both instances above, so it must load after them. -->
      <script src="route-probe.js"></script>

      <!-- keeps rAF prompt; see the file for why the specs need it -->
      <script src="frame-driver.js"></script>
  </body>

</html>
